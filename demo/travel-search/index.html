<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Section Sprinkles Skill 生成的精品旅行搜索首屏 Demo">
    <title>泊远 · 山川旅宿搜索</title>
    <script>
      if (new URLSearchParams(window.location.search).has('preview')) {
        document.documentElement.classList.add('preview');
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --paper: #f3f0e9;
        --ink: #1a1a18;
        --muted: #76746d;
        --line: rgba(26, 26, 24, 0.16);
        --white: #fffef9;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--paper);
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% -10%, rgba(255, 255, 255, 0.96), transparent 36rem),
          var(--paper);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .shell {
        width: min(1360px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0 36px;
      }

      .nav {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        min-height: 64px;
        opacity: 0;
        animation: rise 0.8s 0.05s var(--ease) forwards;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        width: max-content;
        color: inherit;
        text-decoration: none;
      }

      .brand-mark {
        position: relative;
        width: 42px;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1.5px solid currentColor;
        border-radius: 50%;
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        right: -8px;
        bottom: -11px;
        width: 40px;
        height: 32px;
        border: 1.5px solid currentColor;
        border-radius: 50% 50% 0 0;
        content: "";
        transform: rotate(-22deg);
      }

      .brand-mark::after {
        right: 10px;
        bottom: -17px;
        transform: rotate(28deg);
      }

      .brand-copy strong {
        display: block;
        font-family: "Songti SC", STSong, serif;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.28em;
      }

      .brand-copy small {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 8px;
        letter-spacing: 0.24em;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: clamp(26px, 4vw, 64px);
      }

      .nav-links a,
      .nav-action {
        color: inherit;
        font-size: 14px;
        text-decoration: none;
      }

      .nav-links a {
        position: relative;
      }

      .nav-links a::after {
        position: absolute;
        right: 0;
        bottom: -8px;
        left: 0;
        height: 1px;
        background: currentColor;
        content: "";
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.3s var(--ease);
      }

      .nav-links a:hover::after,
      .nav-links a:focus-visible::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      .nav-end {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 22px;
      }

      .nav-action {
        padding: 11px 21px;
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .menu-button {
        display: none;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      .menu-button span,
      .menu-button::before {
        display: block;
        width: 22px;
        height: 1px;
        margin: 6px auto;
        background: currentColor;
        content: "";
        transition: transform 0.25s var(--ease);
      }

      main {
        padding-top: clamp(66px, 10vh, 108px);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 12px;
        letter-spacing: 0.3em;
        text-align: center;
        text-transform: uppercase;
        opacity: 0;
        animation: rise 0.8s 0.16s var(--ease) forwards;
      }

      h1 {
        max-width: 900px;
        margin: 0 auto;
        font-family: "Songti SC", STSong, serif;
        font-size: clamp(48px, 6.5vw, 96px);
        font-weight: 400;
        letter-spacing: 0.06em;
        line-height: 1.08;
        text-align: center;
        text-wrap: balance;
        opacity: 0;
        animation: rise 0.9s 0.24s var(--ease) forwards;
      }

      .subhead {
        margin: 22px auto 0;
        color: var(--muted);
        font-size: 15px;
        letter-spacing: 0.16em;
        text-align: center;
        opacity: 0;
        animation: rise 0.9s 0.32s var(--ease) forwards;
      }

      .search-panel {
        position: relative;
        z-index: 2;
        width: min(840px, 100%);
        margin: 48px auto 0;
        opacity: 0;
        animation: rise 0.9s 0.4s var(--ease) forwards;
      }

      .search-form {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 16px;
        padding: 10px 10px 10px 26px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 254, 249, 0.88);
        box-shadow: 0 18px 50px rgba(27, 27, 23, 0.08);
        backdrop-filter: blur(16px);
      }

      .search-icon {
        width: 18px;
        height: 18px;
        border: 1.5px solid currentColor;
        border-radius: 50%;
      }

      .search-icon::after {
        display: block;
        width: 7px;
        height: 1.5px;
        margin: 14px 0 0 13px;
        background: currentColor;
        content: "";
        transform: rotate(46deg);
        transform-origin: left center;
      }

      .search-form input {
        min-width: 0;
        padding: 14px 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 17px;
      }

      .search-form input::placeholder {
        color: #aaa79f;
      }

      .search-form button {
        min-width: 132px;
        padding: 16px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        cursor: pointer;
        letter-spacing: 0.1em;
        transition: transform 0.25s var(--ease), background 0.25s ease;
      }

      .search-form button:hover,
      .search-form button:focus-visible {
        background: #34332e;
        transform: translateY(-2px);
      }

      .quick-picks {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin: 18px auto 0;
      }

      .quick-picks span {
        margin-right: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .quick-picks button {
        padding: 8px 15px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        transition: background 0.25s ease, color 0.25s ease;
      }

      .quick-picks button:hover,
      .quick-picks button:focus-visible {
        background: var(--ink);
        color: var(--white);
      }

      .search-status {
        min-height: 20px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      .landscape {
        position: relative;
        min-height: 280px;
        margin-top: clamp(46px, 7vh, 76px);
        overflow: hidden;
        border-radius: 72px 72px 18px 18px;
        background: #d9d8d2;
        box-shadow: inset 0 0 0 1px rgba(26, 26, 24, 0.08);
        opacity: 0;
        animation: reveal 1.2s 0.46s var(--ease) forwards;
      }

      .landscape svg {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 280px;
        object-fit: cover;
      }

      .landscape-note {
        position: absolute;
        right: 24px;
        bottom: 20px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 999px;
        background: rgba(24, 24, 22, 0.55);
        color: rgba(255, 255, 255, 0.9);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 10px;
        letter-spacing: 0.18em;
        backdrop-filter: blur(8px);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(22px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes reveal {
        from {
          opacity: 0;
          clip-path: inset(35% 8% 0 round 100px);
          transform: translateY(30px) scale(0.98);
        }
        to {
          opacity: 1;
          clip-path: inset(0 0 0 round 72px 72px 18px 18px);
          transform: translateY(0) scale(1);
        }
      }

      .preview .nav,
      .preview .eyebrow,
      .preview h1,
      .preview .subhead,
      .preview .search-panel,
      .preview .landscape {
        opacity: 1;
        animation: none;
        transform: none;
      }

      .preview .landscape {
        clip-path: none;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100% - 28px, 680px);
          padding-top: 14px;
        }

        .nav {
          grid-template-columns: 1fr auto;
        }

        .nav-links,
        .nav-action {
          display: none;
        }

        .menu-button {
          display: block;
        }

        .nav[data-open="true"] .nav-links {
          position: absolute;
          z-index: 5;
          top: 78px;
          right: 14px;
          display: grid;
          min-width: 190px;
          gap: 0;
          padding: 12px;
          border: 1px solid var(--line);
          border-radius: 20px;
          background: rgba(255, 254, 249, 0.96);
          box-shadow: 0 20px 50px rgba(27, 27, 23, 0.12);
        }

        .nav[data-open="true"] .nav-links a {
          padding: 12px 14px;
        }

        main {
          padding-top: 58px;
        }

        .search-form {
          grid-template-columns: auto 1fr;
          border-radius: 28px;
        }

        .search-form button {
          grid-column: 1 / -1;
          width: 100%;
        }

        .landscape {
          min-height: 240px;
          border-radius: 42px 42px 14px 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="nav" data-open="false">
        <a class="brand" href="#top" aria-label="泊远首页">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-copy"><strong>泊远</strong><small>BOYUAN STAYS</small></span>
        </a>

        <nav class="nav-links" aria-label="主导航">
          <a href="#stays">山野旅宿</a>
          <a href="#routes">慢行路线</a>
          <a href="#journal">在地手记</a>
          <a href="#about">关于泊远</a>
        </nav>

        <div class="nav-end">
          <a class="nav-action" href="#favorites">收藏清单</a>
          <button class="menu-button" type="button" aria-label="打开导航" aria-expanded="false">
            <span></span>
          </button>
        </div>
      </header>

      <main id="top">
        <p class="eyebrow">Quiet journeys · Selected stays</p>
        <h1>去住进山海之间。</h1>
        <p class="subhead">从一间好房开始，慢慢认识一片土地。</p>

        <section class="search-panel" aria-label="搜索目的地">
          <form class="search-form">
            <span class="search-icon" aria-hidden="true"></span>
            <label class="sr-only" for="destination">目的地</label>
            <input id="destination" name="destination" type="search" placeholder="想去哪里住几天？" autocomplete="off">
            <button type="submit">寻找旅宿</button>
          </form>

          <div class="quick-picks" aria-label="热门目的地">
            <span>此刻适合</span>
            <button type="button" data-place="阿勒泰">阿勒泰</button>
            <button type="button" data-place="大理">大理</button>
            <button type="button" data-place="景德镇">景德镇</button>
            <button type="button" data-place="松阳">松阳</button>
            <button type="button" data-place="海边小城">海边小城</button>
          </div>
          <p class="search-status" aria-live="polite"></p>
        </section>

        <figure class="landscape" aria-label="层叠山岭与湖面的抽象黑白风景">
          <svg viewBox="0 0 1360 330" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
            <defs>
              <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e9e8e2"/>
                <stop offset="1" stop-color="#bebdb7"/>
              </linearGradient>
              <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#afb0ab"/>
                <stop offset="0.5" stop-color="#deddd7"/>
                <stop offset="1" stop-color="#9d9e99"/>
              </linearGradient>
              <filter id="soften">
                <feGaussianBlur stdDeviation="8"/>
              </filter>
              <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
                <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="8" result="noise"/>
                <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
                <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 0.12"/></feComponentTransfer>
              </filter>
            </defs>
            <rect width="1360" height="330" fill="url(#sky)"/>
            <path d="M0 177C115 135 189 155 281 111C362 72 438 90 513 139C591 91 690 43 790 98C873 143 925 120 1004 78C1100 26 1204 110 1360 68V258H0Z" fill="#a7a7a1" opacity=".72"/>
            <path d="M0 213C92 173 187 215 286 161C377 111 455 196 559 156C660 116 717 132 816 174C940 227 1028 131 1139 153C1213 168 1289 152 1360 122V269H0Z" fill="#7e807c" opacity=".8"/>
            <path d="M0 243C138 195 218 240 334 203C448 167 574 249 674 203C772 158 880 231 990 198C1117 160 1217 221 1360 178V330H0Z" fill="#555753"/>
            <path d="M0 238C205 268 307 251 473 242C641 233 796 260 952 245C1118 229 1252 245 1360 226V330H0Z" fill="url(#water)" opacity=".92"/>
            <ellipse cx="714" cy="245" rx="390" ry="36" fill="#efeee8" opacity=".42" filter="url(#soften)"/>
            <path d="M0 294C167 283 332 302 501 286C684 269 860 306 1034 286C1168 271 1265 283 1360 272V330H0Z" fill="#3f413e"/>
            <rect width="1360" height="330" filter="url(#grain)" opacity=".28"/>
          </svg>
          <figcaption class="landscape-note">SHANYE COLLECTION · 01</figcaption>
        </figure>
      </main>
    </div>

    <script>
      const form = document.querySelector('.search-form');
      const input = document.querySelector('#destination');
      const status = document.querySelector('.search-status');
      const nav = document.querySelector('.nav');
      const menuButton = document.querySelector('.menu-button');

      document.querySelectorAll('[data-place]').forEach((button) => {
        button.addEventListener('click', () => {
          input.value = button.dataset.place;
          input.focus();
          status.textContent = `已选择 ${button.dataset.place}，可以开始寻找旅宿。`;
        });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const place = input.value.trim();
        status.textContent = place
          ? `正在为你整理 ${place} 的安静住处…`
          : '先写下一个想去的地方。';
      });

      menuButton.addEventListener('click', () => {
        const isOpen = nav.dataset.open === 'true';
        nav.dataset.open = String(!isOpen);
        menuButton.setAttribute('aria-expanded', String(!isOpen));
        menuButton.setAttribute('aria-label', isOpen ? '打开导航' : '关闭导航');
      });
    </script>
  </body>
</html>
